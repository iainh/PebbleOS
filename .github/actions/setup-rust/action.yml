name: Set up Rust
description: Install the pinned Rust toolchain and embedded targets

runs:
  using: composite
  steps:
    - name: Restore Rust toolchain
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/bin/rustup
          ~/.cargo/bin/rustc
          ~/.cargo/bin/cargo
          ~/.rustup
        key: rustup-1.28.2-rust-1.89.0-embedded-v1

    - name: Install Rust
      shell: bash
      run: |
        set -euo pipefail
        export PATH="$HOME/.cargo/bin:$PATH"
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

        if ! command -v rustup >/dev/null; then
          wget --quiet \
            https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
            --output-document=/tmp/rustup-init
          echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" \
            | sha256sum --check
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --default-toolchain none
        fi

        rustup set auto-self-update disable
        if ! rustup toolchain list | grep -q '^1\.89\.0-'; then
          rustup toolchain install 1.89.0 --profile minimal
        fi
        installed_targets=$(rustup target list --installed --toolchain 1.89.0)
        for target in thumbv7em-none-eabi thumbv8m.main-none-eabi; do
          if ! grep -qx "$target" <<<"$installed_targets"; then
            rustup target add --toolchain 1.89.0 "$target"
          fi
        done
        rustc --version
        cargo --version
